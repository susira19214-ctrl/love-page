<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ถามแฟนน่ารักๆ 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Mitr',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#ffb6c1,#ffd1dc,#ffe4ec,#fff0f5);
background-size:300% 300%;
animation:bg 12s infinite;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

#hint{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
background:#ff5f7e;
color:white;
padding:6px 16px;
border-radius:20px;
font-size:0.85rem;
z-index:999;
animation:blink 1.5s infinite;
}

@keyframes blink{
50%{opacity:0.5}
}

#main{
background:white;
width:90%;
max-width:420px;
padding:45px 30px;
border-radius:35px;
text-align:center;
box-shadow:0 20px 50px rgba(255,100,150,0.4);
animation:float 3s infinite;
position:relative;
}

@keyframes float{
50%{transform:translateY(-10px)}
}

h1{
color:#ff2d55;
font-size:2.2rem;
margin-bottom:25px;
}

.btns{
display:flex;
justify-content:center;
gap:20px;
height:70px;
position:relative;
}

button{
padding:14px 26px;
border:none;
border-radius:40px;
font-size:1.1rem;
cursor:pointer;
transition:.2s;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

#yes{
background:linear-gradient(135deg,#ff5f7e,#ff85a2);
color:white;
}

#yes:hover{
transform:scale(1.1);
}

#no{
background:linear-gradient(135deg,#ff5f7e,#ff85a2);
color:white;
}

.retry{
margin-top:25px;
background:linear-gradient(135deg,#ff85a2,#ff5f7e);
color:white;
}

.page{
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:white;
width:90%;
max-width:420px;
padding:50px 30px;
border-radius:35px;
box-shadow:0 20px 50px rgba(255,100,150,0.4);
animation:fade .6s;
}

@keyframes fade{
from{opacity:0;transform:translateY(25px)}
}

.big{
font-size:6rem;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
50%{transform:scale(1.3)}
}

h2{
color:#ff2d55;
margin-top:15px;
}

.fx{
position:fixed;
pointer-events:none;
animation:fly 1.6s forwards;
}

@keyframes fly{
to{transform:translateY(-220px) scale(1.6);opacity:0}
}

.photo{
width:55px;
height:55px;
border-radius:12px;
object-fit:cover;
box-shadow:0 4px 12px rgba(255,0,100,0.4);
}

</style>
</head>

<body>

<div id="hint">💗 แตะหน้าจอเพื่อเริ่มเพลง 💗</div>

<!-- เพลง -->
<audio id="bgm" loop>
<source src="goodbye-hwasa.mp3" type="audio/mpeg">
</audio>

<!-- เสียงคลิก -->
<audio id="sfx">
<source src="click.mp3" type="audio/mpeg">
</audio>

<div id="main">

<h1>เธอรักเรามั้ย 💕</h1>

<div class="btns">
<button id="yes" onclick="love()">รักที่สุด 💖</button>
<button id="no" onclick="noLove()">ไม่รัก 😾</button>
</div>

</div>

<div id="ok" class="page">
<div class="big">🥰</div>
<h2>รักเหมือนกันนน 💞</h2>
</div>

<div id="sad" class="page">
<div class="big">😾</div>
<h2>เข้าจายยยยเรามันไม่สำคัญ 😔😔😔</h2>

<!-- ปุ่มให้โอกาสใหม่ -->
<button class="retry" onclick="resetPage()">
ให้โอกาสใหม่ 💗
</button>

</div>

<script>

let count=0;
let started=false;

const yes=document.getElementById("yes");
const main=document.getElementById("main");
const ok=document.getElementById("ok");
const sad=document.getElementById("sad");
const music=document.getElementById("bgm");
const sfx=document.getElementById("sfx");
const hint=document.getElementById("hint");

/* เริ่มเพลง */
function startMusic(){

if(!started){
music.play();
started=true;
hint.style.display="none";
}

}

document.addEventListener("click", startMusic);

/* กดรัก */
function love(){

sfx.currentTime=0;
sfx.play();

count++;

effect();

if(count>=10){
show(ok);
boom();
}else{
move();
}

}

/* กดไม่รัก */
function noLove(){

// 🔊 เสียง
sfx.currentTime=0;
sfx.play();

show(sad);

for(let i=0;i<12;i++){
setTimeout(()=>effect(),i*120);
}

}

/* เปลี่ยนหน้า */
function show(p){

main.style.display="none";
ok.style.display="none";
sad.style.display="none";

p.style.display="flex";

}

/* รีเซ็ตกลับหน้าแรก */
function resetPage(){

count=0;

main.style.display="block";
ok.style.display="none";
sad.style.display="none";

yes.style.position="static";

}

/* ปุ่มวิ่ง */
function move(){

const box=main.getBoundingClientRect();

const w=yes.offsetWidth;
const h=yes.offsetHeight;

const x=Math.random()*(box.width-w-30);
const y=Math.random()*(box.height-h-30);

yes.style.position="absolute";
yes.style.left=x+15+"px";
yes.style.top=y+15+"px";

}

/* เอฟเฟกต์รูป */
function effect(){

const d=document.createElement("img");

d.src="me.png";
d.className="fx photo";

const r=yes.getBoundingClientRect();

d.style.left=r.left+r.width/2+"px";
d.style.top=r.top+"px";

document.body.appendChild(d);

setTimeout(()=>d.remove(),1600);

}

/* ระเบิด */
function boom(){

setInterval(()=>{

const d=document.createElement("img");

d.src="me.png";
d.className="fx photo";

d.style.left=Math.random()*100+"vw";
d.style.top="85vh";

document.body.appendChild(d);

setTimeout(()=>d.remove(),1600);

},120);

}

</script>

</body>
</html>
